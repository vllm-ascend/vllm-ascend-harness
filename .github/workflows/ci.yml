name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Ruff check
        run: ruff check src tests

      - name: Flake8 check
        run: flake8 src tests

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests -q --tb=short

  ascend-npu:
    name: Ascend NPU Tests
    runs-on: [self-hosted, ascend]
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with Ascend extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ascend]"

      - name: Run Ascend NPU tests
        run: pytest tests -q --tb=short
        env:
          ASCEND_RT_VISIBLE_DEVICES: "0"
