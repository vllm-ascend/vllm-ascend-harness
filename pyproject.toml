[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm_ascend_harness"
version = "0.1.0"
description = "An agent & evaluation harness evolved from OpenHarness for vLLM-Ascend, supporting LLM regression, code agent and sandboxed task execution on Ascend NPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "The vLLM-Ascend Authors" },
]
keywords = [
    "vllm",
    "ascend",
    "npu",
    "agent",
    "evaluation",
    "harness",
    "open-harness",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
ascend = [
    "vllm>=0.6.0",
    "vllm-ascend>=0.0.1",
]
sandbox = [
    "docker>=6.0",
]

[project.urls]
Homepage = "https://github.com/vllm-ascend/vllm-ascend-harness"
Repository = "https://github.com/vllm-ascend/vllm-ascend-harness"
Issues = "https://github.com/vllm-ascend/vllm-ascend-harness/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vllm_ascend_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
